<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kitty Run</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>

* {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}

:root {
    --rosa: #ff8fc7;
    --rosa-fuerte: #e8558f;
    --rosa-suave: #ffd6ec;
    --celeste: #8fd7ff;
    --dorado: #ffc93c;
    --texto: #6b3b63;
}

body{
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #fff0f9, #ffd6ec 60%, #ffc2e6);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: manipulation;
    font-family: 'Baloo 2', 'Verdana', sans-serif;
}

.contenedor {
    width: 100%;
    max-width: 920px;
    height: 280px;
    margin: 0 auto;

    position: relative;
    border-radius: 18px;
    box-shadow: 0 12px 34px rgba(180, 60, 130, 0.35), 0 0 0 4px #fff;

    background-image: url(img/sky.jpg);
    background-size: cover;
    background-position: center bottom;
    overflow: hidden;
}

.contenedor::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    background: transparent;
    transition: background 1.2s ease, opacity 1.2s ease;
    pointer-events: none;
}

/* Ajustes para pantallas pequeñas */
@media (max-width: 920px) {
    .contenedor {
        height: 200px;
    }
}

@media (max-width: 480px) {
    .contenedor {
        height: 180px;
    }
}

.mediodia::before {
    background: rgba(255, 214, 130, 0.25);
}

.tarde::before {
    background: rgba(255, 120, 110, 0.35);
}

.noche::before {
    background: rgba(30, 20, 70, 0.55);
}

.dino {
    width: 84px;
    height: 84px;

    position: absolute;
    bottom: 22px;
    left: 42px;
    z-index: 4;

    background: url(img/kitty.png) repeat-x 0px 0px;
    background-size: 336px 84px;
    background-position-x: 0px;
}

.sombra {
    width: 60px;
    height: 12px;

    position: absolute;
    bottom: 18px;
    left: 54px;
    z-index: 3;

    background: radial-gradient(ellipse at center, rgba(107, 59, 99, 0.35) 0%, rgba(107, 59, 99, 0) 70%);
    transition: width 0.1s linear, opacity 0.1s linear;
}

/* Hacer el dino más pequeño en móviles */
@media (max-width: 480px) {
    .dino {
        width: 60px;
        height: 60px;
        background-size: 240px 60px;
        left: 30px;
        bottom: 16px;
    }

    .sombra {
        width: 42px;
        left: 39px;
        bottom: 12px;
    }
}

.dino-corriendo {
    animation: animarDino 0.25s steps(2) infinite;
}
.dino-estrellado {
    background-position-x: -252px;
}

@media (max-width: 480px) {
    .dino-estrellado {
        background-position-x: -180px;
    }
}

.suelo {
    width: 200%;
    height: 42px;

    position: absolute;
    bottom: 0;
    left: 0;
    z-index: 2;

    background: url(img/suelo.png) repeat-x 0px 0px;
    background-size: 50% 42px;
}

@media (max-width: 480px) {
    .suelo {
        height: 30px;
        background-size: 50% 30px;
    }
}

.cactus{
    width: 46px;
    height: 96px;

    position: absolute;
    bottom: 16px;
    left: 600px;
    z-index: 3;

    background: url(img/cactus1.png) no-repeat;
    background-size: contain;
}

@media (max-width: 480px) {
    .cactus{
        width: 35px;
        height: 70px;
        bottom: 12px;
    }
}

.cactus2{
    width: 98px;
    height: 66px;
    background: url(img/cactus2.png) no-repeat;
    background-size: contain;
}

@media (max-width: 480px) {
    .cactus2{
        width: 70px;
        height: 50px;
    }
}

.nube{
    width: 92px;
    height: 26px;

    position: absolute;
    z-index: 1;

    background: url(img/nube.png) no-repeat;
    background-size: 92px 26px;
    opacity: 0.9;
}

.hud {
    position: absolute;
    top: 12px;
    right: 16px;
    z-index: 10;

    display: flex;
    align-items: baseline;
    gap: 12px;

    font-family: 'Baloo 2', sans-serif;
    color: var(--texto);
    text-shadow: 0 2px 0 rgba(255,255,255,0.6);
}

.hud .hi {
    display: flex;
    align-items: baseline;
    gap: 4px;
    font-size: 15px;
    font-weight: 700;
    color: var(--rosa-fuerte);
    opacity: 0.85;
}

.hud .hi small {
    font-size: 11px;
    letter-spacing: 1px;
}

.score{
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 1px;
}

.score.pop {
    animation: scorePop 0.4s ease;
}

@keyframes scorePop {
    0% { transform: scale(1); }
    40% { transform: scale(1.5); color: var(--dorado); }
    100% { transform: scale(1); }
}

@media (max-width: 480px) {
    .hud {
        top: 8px;
        right: 10px;
        gap: 8px;
    }
    .score{
        font-size: 20px;
    }
    .hud .hi {
        font-size: 12px;
    }
}

.overlay {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 20;

    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-align: center;
    padding: 20px;

    background: rgba(255, 245, 251, 0.82);
    backdrop-filter: blur(2px);
}

.overlay.visible {
    display: flex;
}

.overlay-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 22px 32px;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 10px 26px rgba(232, 85, 143, 0.25);
    border: 3px solid var(--rosa-suave);
}

.overlay-emoji {
    font-size: 42px;
    line-height: 1;
}

.overlay-title {
    font-size: 26px;
    font-weight: 800;
    color: var(--rosa-fuerte);
    letter-spacing: 1px;
}

.overlay-sub {
    font-size: 15px;
    color: var(--texto);
    opacity: 0.85;
}

.overlay-scores {
    display: flex;
    gap: 22px;
    margin: 4px 0;
}

.overlay-scores div {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.overlay-scores span.label {
    font-size: 11px;
    letter-spacing: 1px;
    color: var(--texto);
    opacity: 0.6;
}

.overlay-scores span.value {
    font-size: 22px;
    font-weight: 800;
    color: var(--texto);
}

.overlay-btn {
    margin-top: 6px;
    padding: 10px 26px;
    border: none;
    border-radius: 999px;
    background: linear-gradient(135deg, var(--rosa), var(--rosa-fuerte));
    color: #fff;
    font-family: 'Baloo 2', sans-serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(232, 85, 143, 0.4);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
}

.overlay-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(232, 85, 143, 0.5);
}

.overlay-btn:active {
    transform: translateY(0);
    box-shadow: 0 4px 10px rgba(232, 85, 143, 0.4);
}

@media (max-width: 480px) {
    .overlay-card { padding: 16px 22px; }
    .overlay-emoji { font-size: 32px; }
    .overlay-title { font-size: 20px; }
    .overlay-sub { font-size: 13px; }
    .overlay-scores span.value { font-size: 18px; }
    .overlay-btn { font-size: 14px; padding: 8px 20px; }
}

.instrucciones {
    position: absolute;
    bottom: 10px;
    width: 100%;
    text-align: center;
    color: var(--texto);
    font-family: 'Baloo 2', sans-serif;
    font-size: 15px;
    font-weight: 700;
    z-index: 5;
    text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    transition: opacity 0.4s ease;
}

.instrucciones.oculta {
    opacity: 0;
    pointer-events: none;
}

@media (max-width: 480px) {
    .instrucciones {
        font-size: 13px;
        bottom: 5px;
    }
}

@keyframes animarDino{
    from{
        background-position-x: -84px;
    }
    to{
        background-position-x: -252px;
    }
}

@media (max-width: 480px) {
    @keyframes animarDino{
        from{
            background-position-x: -60px;
        }
        to{
            background-position-x: -180px;
        }
    }
}

    </style>
</head>
<body>

    <div class="contenedor">

        <div class="suelo"></div>

        <div class="sombra"></div>

        <div class="dino"></div>

        <div class="hud">
            <div class="hi"><small>HI</small> <span class="high-score">00</span></div>
            <div class="score">00</div>
        </div>

        <div class="overlay start-screen visible">
            <div class="overlay-card">
                <div class="overlay-title">Tycoon Run</div>
                <div class="overlay-sub">No recuerdo que era un tycoon pero a ti te gusta entonces jaj</div>
                <button type="button" class="overlay-btn start-btn">▶ Jugar</button>
            </div>
        </div>

        <div class="overlay game-over">
            <div class="overlay-card">
                <div class="overlay-emoji">💥</div>
                <div class="overlay-title">GAME OVER</div>
                <div class="overlay-scores">
                    <div><span class="label">SCORE</span><span class="value final-score">0</span></div>
                    <div><span class="label">HI</span><span class="value final-high-score">0</span></div>
                </div>
                <button type="button" class="overlay-btn restart-btn">↻ Reintentar</button>
            </div>
        </div>

        <div class="instrucciones oculta">▲ Toca la pantalla o presiona ESPACIO para saltar</div>

    </div>

<script>

//****** GAME LOOP ********//

var time = new Date();
var deltaTime = 0;

if(document.readyState === "complete" || document.readyState === "interactive"){
    setTimeout(Init, 1);
}else{
    document.addEventListener("DOMContentLoaded", Init); 
}

function Init() {
    time = new Date();
    Start();
    Loop();
}

function Loop() {
    deltaTime = (new Date() - time) / 1000;
    time = new Date();
    Update();
    requestAnimationFrame(Loop);
}

//****** GAME LOGIC ********//

var sueloY = 22;
var velY = 0;
var impulso = 900;
var gravedad = 2500;

var dinoPosX = 42;
var dinoPosY = sueloY; 

var sueloX = 0;
var velEscenario = 1280/3;
var gameVel = 1;
var gameVelObjetivo = 1;
var velRampaMax = 30;
var velLerp = 1.4;
var score = 0;

var parado = false;
var saltando = false;

var tiempoHastaObstaculo = 2;
var tiempoObstaculoMin = 0.7;
var tiempoObstaculoMax = 1.8;
var obstaculoPosY = 16;
var obstaculos = [];

var tiempoHastaNube = 0.5;
var tiempoNubeMin = 0.7;
var tiempoNubeMax = 2.7;
var maxNubeY = 270;
var minNubeY = 100;
var nubes = [];
var velNube = 0.5;

var contenedor;
var dino;
var sombra;
var textoScore;
var textoHighScore;
var textoFinalScore;
var textoFinalHighScore;
var suelo;
var gameOver;
var startScreen;
var instrucciones;
var juegoIniciado = false;
var highScore = 0;

var HIGH_SCORE_KEY = "kittyRunHighScore";

// Ajustar valores para móvil
if(window.innerWidth <= 480) {
    sueloY = 16;
    dinoPosY = sueloY;
    obstaculoPosY = 12;
    dinoPosX = 30;
}

function Start() {
    gameOver = document.querySelector(".game-over");
    startScreen = document.querySelector(".start-screen");
    suelo = document.querySelector(".suelo");
    contenedor = document.querySelector(".contenedor");
    textoScore = document.querySelector(".score");
    textoHighScore = document.querySelector(".high-score");
    textoFinalScore = document.querySelector(".final-score");
    textoFinalHighScore = document.querySelector(".final-high-score");
    dino = document.querySelector(".dino");
    sombra = document.querySelector(".sombra");
    instrucciones = document.querySelector(".instrucciones");

    highScore = parseInt(localStorage.getItem(HIGH_SCORE_KEY), 10) || 0;
    ActualizarTextoHighScore();

    document.addEventListener("keydown", HandleKeyDown);
    document.addEventListener("touchstart", HandleTouchStart);
    document.addEventListener("click", HandleClick);

    document.querySelector(".start-btn").addEventListener("click", IniciarJuego);
    document.querySelector(".restart-btn").addEventListener("click", function(ev){
        ev.stopPropagation();
        Reiniciar();
    });

    // Prevenir zoom en doble tap
    let lastTouchEnd = 0;
    document.addEventListener('touchend', function (event) {
        const now = (new Date()).getTime();
        if (now - lastTouchEnd <= 300) {
            event.preventDefault();
        }
        lastTouchEnd = now;
    }, false);
}

function Update() {
    if(parado || !juegoIniciado) return;

    ActualizarVelocidadJuego();
    MoverDinosaurio();
    MoverSuelo();
    DecidirCrearObstaculos();
    DecidirCrearNubes();
    MoverObstaculos();
    MoverNubes();
    DetectarColision();

    velY -= gravedad * deltaTime;
}

function ActualizarVelocidadJuego() {
    gameVel += (gameVelObjetivo - gameVel) * Math.min(1, deltaTime * velLerp);
    suelo.style.animationDuration = (3/gameVel)+"s";
}

function ActualizarTextoHighScore() {
    var valor = String(highScore).padStart(2, "0");
    if(textoHighScore) textoHighScore.innerText = valor;
    if(textoFinalHighScore) textoFinalHighScore.innerText = highScore;
}

function IniciarJuego() {
    if(juegoIniciado) return;
    juegoIniciado = true;
    if(startScreen) startScreen.classList.remove("visible");
    if(instrucciones) instrucciones.classList.remove("oculta");
    dino.classList.add("dino-corriendo");
}

function HandleKeyDown(ev){
    if(ev.keyCode == 32){
        ev.preventDefault();
        if(!juegoIniciado) {
            IniciarJuego();
        } else if(parado) {
            Reiniciar();
        } else {
            Saltar();
        }
    }
}

function HandleTouchStart(ev) {
    if(ev.target.closest(".overlay-btn")) return;
    ev.preventDefault();
    if(!juegoIniciado) {
        IniciarJuego();
    } else if(parado) {
        Reiniciar();
    } else {
        Saltar();
    }
}

function HandleClick(ev) {
    if(ev.target.closest(".overlay-btn")) return;
    if(!juegoIniciado) {
        IniciarJuego();
    } else if(parado) {
        Reiniciar();
    }
}

function Saltar(){
    if(dinoPosY === sueloY){
        saltando = true;
        velY = impulso;
        dino.classList.remove("dino-corriendo");
        if(instrucciones) instrucciones.classList.add("oculta");
    }
}

function MoverDinosaurio() {
    dinoPosY += velY * deltaTime;
    if(dinoPosY < sueloY){
        TocarSuelo();
    }
    dino.style.bottom = dinoPosY+"px";
    ActualizarSombra();
}

function ActualizarSombra() {
    if(!sombra) return;
    var altura = dinoPosY - sueloY;
    var factor = Math.max(0.35, 1 - altura / 160);
    sombra.style.transform = "scale(" + factor.toFixed(2) + ")";
    sombra.style.opacity = factor.toFixed(2);
}

function TocarSuelo() {
    dinoPosY = sueloY;
    velY = 0;
    if(saltando){
        dino.classList.add("dino-corriendo");
    }
    saltando = false;
}

function MoverSuelo() {
    sueloX += CalcularDesplazamiento();
    suelo.style.left = -(sueloX % contenedor.clientWidth) + "px";
}

function CalcularDesplazamiento() {
    return velEscenario * deltaTime * gameVel;
}

function Estrellarse() {
    dino.classList.remove("dino-corriendo");
    dino.classList.add("dino-estrellado");
    parado = true;
}

function DecidirCrearObstaculos() {
    tiempoHastaObstaculo -= deltaTime;
    if(tiempoHastaObstaculo <= 0) {
        CrearObstaculo();
    }
}

function DecidirCrearNubes() {
    tiempoHastaNube -= deltaTime;
    if(tiempoHastaNube <= 0) {
        CrearNube();
    }
}

function CrearObstaculo() {
    var obstaculo = document.createElement("div");
    contenedor.appendChild(obstaculo);
    obstaculo.classList.add("cactus");
    if(Math.random() > 0.5) obstaculo.classList.add("cactus2");
    obstaculo.posX = contenedor.clientWidth;
    obstaculo.style.left = contenedor.clientWidth+"px";

    obstaculos.push(obstaculo);
    tiempoHastaObstaculo = tiempoObstaculoMin + Math.random() * (tiempoObstaculoMax-tiempoObstaculoMin) / gameVel;
}

function CrearNube() {
    var nube = document.createElement("div");
    contenedor.appendChild(nube);
    nube.classList.add("nube");
    nube.posX = contenedor.clientWidth;
    nube.style.left = contenedor.clientWidth+"px";
    nube.style.bottom = minNubeY + Math.random() * (maxNubeY-minNubeY)+"px";
    
    nubes.push(nube);
    tiempoHastaNube = tiempoNubeMin + Math.random() * (tiempoNubeMax-tiempoNubeMin) / gameVel;
}

function MoverObstaculos() {
    for (var i = obstaculos.length - 1; i >= 0; i--) {
        if(obstaculos[i].posX < -obstaculos[i].clientWidth) {
            obstaculos[i].parentNode.removeChild(obstaculos[i]);
            obstaculos.splice(i, 1);
            GanarPuntos();
        }else{
            obstaculos[i].posX -= CalcularDesplazamiento();
            obstaculos[i].style.left = obstaculos[i].posX+"px";
        }
    }
}

function MoverNubes() {
    for (var i = nubes.length - 1; i >= 0; i--) {
        if(nubes[i].posX < -nubes[i].clientWidth) {
            nubes[i].parentNode.removeChild(nubes[i]);
            nubes.splice(i, 1);
        }else{
            nubes[i].posX -= CalcularDesplazamiento() * velNube;
            nubes[i].style.left = nubes[i].posX+"px";
        }
    }
}

function GanarPuntos() {
    score++;
    textoScore.innerText = String(score).padStart(2, "0");
    textoScore.classList.remove("pop");
    void textoScore.offsetWidth;
    textoScore.classList.add("pop");

    if(score > highScore){
        highScore = score;
        localStorage.setItem(HIGH_SCORE_KEY, highScore);
        ActualizarTextoHighScore();
    }

    gameVelObjetivo = 1 + Math.min(score, velRampaMax) * (2 / velRampaMax);

    if(score == 5){
        contenedor.classList.add("mediodia");
    }else if(score == 10) {
        contenedor.classList.add("tarde");
    } else if(score == 20) {
        contenedor.classList.add("noche");
    }
}

function GameOver() {
    Estrellarse();
    if(textoFinalScore) textoFinalScore.innerText = score;
    ActualizarTextoHighScore();
    gameOver.classList.add("visible");
}

function Reiniciar() {
    parado = false;
    score = 0;
    gameVel = 1;
    gameVelObjetivo = 1;

    contenedor.classList.remove("mediodia", "tarde", "noche");

    gameOver.classList.remove("visible");
    dino.classList.remove("dino-estrellado");
    dino.classList.add("dino-corriendo");

    textoScore.innerText = String(score).padStart(2, "0");

    // Limpiar obstáculos
    obstaculos.forEach(obstaculo => {
        obstaculo.parentNode.removeChild(obstaculo);
    });
    obstaculos = [];
    
    // Limpiar nubes
    nubes.forEach(nube => {
        nube.parentNode.removeChild(nube);
    });
    nubes = [];
    
    tiempoHastaObstaculo = 2;
    tiempoHastaNube = 0.5;
    
    dinoPosY = sueloY;
    velY = 0;
    saltando = false;
}

function DetectarColision() {
    for (var i = 0; i < obstaculos.length; i++) {
        if(obstaculos[i].posX > dinoPosX + dino.clientWidth) {
            break;
        }else{
            if(IsCollision(dino, obstaculos[i], 10, 30, 15, 20)) {
                GameOver();
            }
        }
    }
}

function IsCollision(a, b, paddingTop, paddingRight, paddingBottom, paddingLeft) {
    var aRect = a.getBoundingClientRect();
    var bRect = b.getBoundingClientRect();

    return !(
        ((aRect.top + aRect.height - paddingBottom) < (bRect.top)) ||
        (aRect.top + paddingTop > (bRect.top + bRect.height)) ||
        ((aRect.left + aRect.width - paddingRight) < bRect.left) ||
        (aRect.left + paddingLeft > (bRect.left + bRect.width))
    );
}

</script>
</body>
